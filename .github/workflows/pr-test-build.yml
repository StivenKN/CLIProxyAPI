name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # Some concurrency regression tests only fail under the race detector.
      # The sdk/cliproxy root package is left out until its auth-sync tests stop
      # assuming goroutine order; they flake under -race scheduling.
      - name: Test with race detector
        run: >-
          go test -race ./internal/runtime/executor/... ./internal/wsrelay/... ./internal/config/...
          ./sdk/cliproxy/auth/... ./sdk/cliproxy/executionregistry/... ./sdk/cliproxy/executor/...
          ./sdk/cliproxy/session/... ./sdk/cliproxy/usage/...
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
