name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # Some concurrency regression tests only fail under the race detector.
      - name: Test with race detector
        run: go test -race ./internal/runtime/executor/... ./sdk/cliproxy/... ./internal/wsrelay/... ./internal/config/...
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
